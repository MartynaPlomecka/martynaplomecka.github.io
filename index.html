<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>Martyna Płomecka | Research Scientist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Font and Icon Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .card {
      max-width: 960px;
      margin: 60px auto;
      position: relative;
      min-height: 420px;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0,0,0,0.1);
    }

    /* Photo as full background */
    .card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/me.jpg');
      background-size: cover;
      background-position: center center;
    }

    /* Gradient fade: transparent on the left, white on the right */
    .card-bg::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to left,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.3) 30%,
        rgba(255,255,255,0.85) 50%,
        rgba(255,255,255,1) 65%
      );
    }

    /* Text panel on the right */
    .info {
      position: relative;
      z-index: 2;
      margin-left: 0;
      margin-right: 50%;
      padding: 60px 0 60px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 420px;
      box-sizing: border-box;
    }

    .info h1 {
      margin: 0 0 8px 0;
      font-weight: 300;
      font-size: 1.8rem;
      color: #222;
    }

    .info .subtitle {
      margin: 0 0 20px 0;
      font-size: 1.05rem;
      color: #555;
      line-height: 1.6;
    }

    .info .scholar {
      margin: 0 0 28px 0;
      font-size: 1.05rem;
      color: #555;
      line-height: 1.6;
    }

    .info .scholar a {
      color: #0073e6;
      text-decoration: none;
    }

    .info .scholar a:hover {
      text-decoration: underline;
    }

    /* Icons row */
    .icons {
      display: flex;
      gap: 18px;
    }

    .icons a {
      font-size: 21px;
      color: #555;
      transition: color 0.2s;
    }

    .icons a:hover {
      color: #0073e6;
    }

    /* Footer */
    footer {
      max-width: 960px;
      margin: 0 auto;
      color: #aaa;
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
    }

    /* Mobile: stack vertically */
    @media (max-width: 700px) {
      .card {
        margin: 0;
        box-shadow: none;
        min-height: auto;
      }

      .card-bg {
        position: relative;
        height: 300px;
      }

      .card-bg::after {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0) 40%,
          rgba(255,255,255,1) 100%
        );
      }

      .info {
        margin-left: 0;
        margin-right: 0;
        padding: 24px;
        min-height: auto;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-bg"></div>

    <div class="info">
      <h1>Martyna Płomecka</h1>
      <p class="subtitle">Research Scientist at Google DeepMind, NYC</p>
      <p class="scholar">For up-to-date research, check my <a href="https://scholar.google.com/citations?hl=en&user=J5MIOdQAAAAJ" target="_blank">Google Scholar</a>.</p>

      <div class="icons">
        <a href="mailto:mbplomecka@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
        <a href="https://scholar.google.com/citations?hl=en&user=J5MIOdQAAAAJ" target="_blank" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
        <a href="https://twitter.com/MartynaPlomecka" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="https://github.com/MartynaPlomecka" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/martynaplomecka/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="https://www.kaggle.com/martynaplomecka" target="_blank" title="Kaggle"><i class="fab fa-kaggle"></i></a>
        <a href="https://research.google/people/martynaplomecka/?&type=google" target="_blank" title="Google Research"><i class="fab fa-google"></i></a>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Martyna Płomecka</p>
  </footer>

</body>
</html>
